services:
  - type: web
    name: customer-return-agent-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: true
      - key: OPERATIONAL_MODEL_PROVIDER
        value: anthropic
      - key: OPERATIONAL_MODEL_MODEL
        value: claude-sonnet-5
      - key: OPERATIONAL_MODEL_EFFORT
        value: medium
      - key: OPERATIONAL_MODEL_MAX_TOKENS
        value: 12000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RETURN_SHIPPING_PROVIDER
        value: mock
      - key: DATABASE_PATH
        value: /tmp/customer-return-agent.db
